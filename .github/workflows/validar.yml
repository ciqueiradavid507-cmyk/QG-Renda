name: Validar QG RENDA Demo
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Validar sintaxe
        run: python -m compileall -q main.py
      - name: Verificar ambiente demonstrativo
        env:
          DEMO_ONLY: 'true'
        run: python -c "import main; assert main.DEMO_ONLY is True"
