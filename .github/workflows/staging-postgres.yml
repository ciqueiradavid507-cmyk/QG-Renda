name: Validar PostgreSQL fictício em CI
on:
  push:
    branches:
      - preparacao-pagamentos-asaas-seguro
  pull_request:
    paths:
      - 'db/migrations/**'
      - 'tests/test_staging_postgres.py'
      - 'requirements-dev.txt'
      - '.github/workflows/staging-postgres.yml'
  workflow_dispatch:
jobs:
  validar-postgresql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qgr_ci
          POSTGRES_PASSWORD: ci_ficticio_descartavel
          POSTGRES_DB: qgr_staging_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qgr_ci -d qgr_staging_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEMO_ONLY: "true"
      PG_STAGING_TEST_DSN: postgresql://qgr_ci:ci_ficticio_descartavel@localhost:5432/qgr_staging_test
    steps:
      - name: Obter código do projeto
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências de teste
        run: python -m pip install -r requirements-dev.txt
      - name: Validar SQL, deduplicação e rollback
        run: python -m unittest tests/test_staging_postgres.py -v
